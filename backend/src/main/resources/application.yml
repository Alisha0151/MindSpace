spring:
  application:
    name: mindspace
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/mindspace}
    username: ${SPRING_DATASOURCE_USERNAME:mindspace}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      connection-timeout: 10000
      max-lifetime: 1500000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate          # schema is owned by Flyway; Hibernate only validates it
    properties:
      hibernate:
        default_batch_fetch_size: 50   # avoids N+1 on tag collections
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: false
  servlet:
    multipart:
      enabled: false
  lifecycle:
    timeout-per-shutdown-phase: 20s

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  max-http-request-header-size: 16KB
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never
  tomcat:
    max-swallow-size: 128KB
    connection-timeout: 10s

management:
  endpoints:
    web:
      exposure:
        include: health        # nothing else is exposed (no env, beans, configprops)
  endpoint:
    health:
      probes:
        enabled: true          # /actuator/health/liveness and /readiness
      show-details: never
  health:
    defaults:
      enabled: true

springdoc:
  api-docs:
    enabled: ${MINDSPACE_API_DOCS_ENABLED:true}
  swagger-ui:
    enabled: ${MINDSPACE_API_DOCS_ENABLED:true}

logging:
  pattern:
    level: "%5p [%X{requestId:-}]"
  level:
    root: INFO
    org.hibernate.SQL: WARN    # never log SQL/parameters: they can contain journal text

mindspace:
  security:
    # REQUIRED, at least 32 characters. No default on purpose: the app refuses to start without it.
    jwt-secret: ${MINDSPACE_JWT_SECRET}
    access-token-ttl: 10m
    refresh-token-ttl: 14d
    bcrypt-strength: ${MINDSPACE_BCRYPT_STRENGTH:12}
    cookie-secure: ${MINDSPACE_COOKIE_SECURE:false}   # set true behind HTTPS
    cookie-same-site: ${MINDSPACE_COOKIE_SAME_SITE:Lax}
  cors:
    allowed-origins: ${MINDSPACE_CORS_ALLOWED_ORIGINS:http://localhost:5173}
  rate-limit:
    auth-ip-max: 30            # login/register/refresh per IP per window
    auth-ip-window: 10m
    login-email-max: 5         # failed+successful login attempts per e-mail per window
    login-email-window: 15m
    sensitive-ip-max: 10       # password change, export, account deletion per IP per window
    sensitive-ip-window: 10m
  request:
    max-body-bytes: 65536
