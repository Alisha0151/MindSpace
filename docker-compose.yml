# Verified in CI: `docker compose up --build --wait` succeeds and the Playwright E2E job passes against it. Copy .env.example to .env first.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mindspace}
      POSTGRES_USER: ${POSTGRES_USER:-mindspace}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
  backend:
    build:
      context: backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-mindspace}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-mindspace}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      MINDSPACE_JWT_SECRET: ${MINDSPACE_JWT_SECRET:?set MINDSPACE_JWT_SECRET (>= 32 bytes) in .env}
      MINDSPACE_CORS_ALLOWED_ORIGINS: ${MINDSPACE_CORS_ALLOWED_ORIGINS:-http://localhost:8081}
      MINDSPACE_COOKIE_SECURE: ${MINDSPACE_COOKIE_SECURE:-false}
  frontend:
    build:
      context: frontend
    depends_on:
      - backend
    ports:
      - "8081:80"
volumes:
  dbdata:
