server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # Same-origin API so the HttpOnly cookies and CSRF cookie work without CORS.
  location /api/ {
    proxy_pass http://backend:8080;
    proxy_set_header Host $http_host;   # keep the port so same-origin requests are recognised by Spring CORS
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
  location /v3/api-docs { proxy_pass http://backend:8080; }
  location /swagger-ui/ { proxy_pass http://backend:8080; }

  location / { try_files $uri /index.html; add_header Cache-Control "no-cache"; include /etc/nginx/security-headers.conf; }
  location /assets/ { add_header Cache-Control "public, max-age=31536000, immutable"; include /etc/nginx/security-headers.conf; }
}
