# CI: database (psql), backend (mvn verify + Testcontainers), frontend (type-check, tests, build), E2E (Playwright vs docker compose).
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  database:
    name: Database migrations and SQL tests (psql, temporary cluster)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Make sure PostgreSQL server binaries are present
        run: sudo apt-get update && sudo apt-get install -y postgresql postgresql-client && sudo systemctl stop postgresql
      - name: Run SQL assertions against the migrations
        run: ./db/scripts/run-db-tests.sh   # creates its own throwaway cluster; picks the newest /usr/lib/postgresql/*/bin

  backend:
    name: Backend (Java 21, Maven, Testcontainers)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21', cache: maven }
      - name: Unit and integration tests
        working-directory: backend
        shell: bash
        run: |
          # surefire (*Test) then failsafe (*IT, needs Docker, available on ubuntu-latest).
          # The first [ERROR] lines are also emitted as annotations so failures are readable without the raw log.
          set -o pipefail
          # Docker Engine 29 on the runner rejects the old default API version used by this Testcontainers release.
          echo "api.version=1.44" > ~/.docker-java.properties
          mvn -B verify 2>&1 | tee mvn.log || status=$?
          if [ -n "${status:-}" ]; then
            # One multi-line annotation: first [ERROR] lines, else the tail of the log.
            if grep -qE '\[ERROR\]' mvn.log; then body=$(grep -E '\[ERROR\]' mvn.log | head -40); else body=$(tail -60 mvn.log); fi
            body="${body//'%'/'%25'}"; body="${body//$'\n'/'%0A'}"; body="${body//$'\r'/'%0D'}"
            echo "::error title=Maven output::${body:0:30000}"
            # Stack traces / root causes from the test reports and the application log.
            detail=$( { grep -hE 'Unhandled|Caused by|requestId' mvn.log | head -40; echo ----; cat target/failsafe-reports/*.txt 2>/dev/null | grep -vE '^\s+at (org\.junit|java\.base|org\.apache|jdk\.)' | head -120; } )
            detail="${detail//'%'/'%25'}"; detail="${detail//$'\n'/'%0A'}"; detail="${detail//$'\r'/'%0D'}"
            echo "::error title=Test report detail::${detail:0:30000}"
          fi
          exit ${status:-0}

  frontend:
    name: Frontend (type-check, unit tests, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          # Cache only when a lockfile exists; setup-node fails if the cache path does not resolve.
          cache: ${{ hashFiles('frontend/package-lock.json') != '' && 'npm' || '' }}
          cache-dependency-path: frontend/package-lock.json
      - working-directory: frontend
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi
          npm run typecheck
          npm test
          npm run build

  e2e:
    name: End-to-end (Playwright against docker compose)
    runs-on: ubuntu-latest
    needs: [database, backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Create a throwaway .env
        run: |
          cp .env.example .env
          echo "POSTGRES_PASSWORD=$(openssl rand -hex 16)" >> .env
          echo "MINDSPACE_JWT_SECRET=$(openssl rand -hex 32)" >> .env
          echo "MINDSPACE_CORS_ALLOWED_ORIGINS=http://localhost:8081" >> .env
      - run: docker compose up -d --build --wait
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          # Cache only when a lockfile exists; setup-node fails if the cache path does not resolve.
          cache: ${{ hashFiles('frontend/package-lock.json') != '' && 'npm' || '' }}
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies and run Playwright
        working-directory: frontend
        shell: bash
        env: { E2E_BASE_URL: 'http://localhost:8081' }
        run: |
          set -o pipefail
          { if [ -f package-lock.json ]; then npm ci; else npm install; fi
            npx playwright install --with-deps chromium
            npx playwright test; } 2>&1 | tee e2e.log || status=$?
          if [ -n "${status:-}" ]; then
            body=$(tail -80 e2e.log); body="${body//'%'/'%25'}"; body="${body//$'\n'/'%0A'}"; body="${body//$'\r'/'%0D'}"
            echo "::error title=E2E output::${body:0:30000}"
          fi
          exit ${status:-0}
      - if: failure()
        shell: bash
        run: |
          ctx=$(cat frontend/test-results/*/error-context.md 2>/dev/null | head -60)
          logs=$(docker compose logs --no-color backend frontend 2>&1 | grep -E 'ERROR|WARN|/api/v1/auth|Exception' | cut -c1-700 | tail -25)
          d="$ctx
          ---- compose logs ----
          $logs"
          d="${d//'%'/'%25'}"; d="${d//$'\n'/'%0A'}"; d="${d//$'\r'/'%0D'}"
          echo "::error title=E2E diagnostics::${d:0:30000}"
          docker compose logs --no-color | tail -200
